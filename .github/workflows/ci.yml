name: CI

# Every push to any branch is built and tested, and so is every pull request
# into main. With branch protection on main requiring the "CI passed" check
# (see docs/TESTING.md), nothing can be merged unless the whole pipeline is green.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            werror: "ON"
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            werror: "OFF"
          - name: Windows MSVC
            os: windows-2022
            cc: ""
            cxx: ""
            werror: "OFF"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMINIDB_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Each layer is its own step, so the CI page shows exactly which part broke.
      - name: "Unit tests: storage (disk, LRU, buffer pool, pages, heap, B+ tree, catalog)"
        run: bash ci/run-tests.sh build Release storage

      - name: "Unit tests: query processing (lexer, parser, expressions, executors, planner)"
        run: bash ci/run-tests.sh build Release query

      - name: Integration tests
        run: bash ci/run-tests.sh build Release integration

      - name: End-to-end tests (SQL shell)
        run: bash ci/run-tests.sh build Release e2e

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cc || 'msvc' }}
          path: |
            build/ctest-*.log
            build/Testing/Temporary/LastTest*.log
            build/tests/e2e_work/
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMINIDB_SANITIZE=ON
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build --parallel 4

      - name: All tests under sanitizers
        run: bash ci/run-tests.sh build Debug "unit|integration|e2e"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitizers
          path: |
            build/ctest-*.log
            build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore

  # Single required status check for branch protection: it is green only if
  # every job above succeeded. Adding jobs later does not require touching the
  # branch protection settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-and-test, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results of all jobs
        run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "sanitizers:     ${{ needs.sanitizers.result }}"
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.sanitizers.result }}" != "success" ]; then
            echo "::error::CI failed"
            exit 1
          fi
